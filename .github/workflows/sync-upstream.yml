name: sync-upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync upstream main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/cursor/plugins.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date"
            exit 0
          fi
          if ! git merge --no-edit FETCH_HEAD; then
            UNMERGED=$(git diff --name-only --diff-filter=U)
            if [ "$UNMERGED" != ".cursor-plugin/marketplace.json" ]; then
              git merge --abort || true
              exit 1
            fi
            BASE=""
            OURS=""
            THEIRS=""
            cleanup_conflict() {
              rm -f "${BASE:-}" "${OURS:-}" "${THEIRS:-}"
              if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
                git merge --abort || true
              fi
            }
            trap cleanup_conflict EXIT
            BASE=$(mktemp)
            OURS=$(mktemp)
            THEIRS=$(mktemp)
            if ! git show :1:.cursor-plugin/marketplace.json > "$BASE" 2>/dev/null; then
              git show "$(git merge-base HEAD FETCH_HEAD):.cursor-plugin/marketplace.json" > "$BASE"
            fi
            git show :2:.cursor-plugin/marketplace.json > "$OURS"
            git show :3:.cursor-plugin/marketplace.json > "$THEIRS"
            node scripts/merge-marketplace.mjs "$BASE" "$OURS" "$THEIRS" .cursor-plugin/marketplace.json
            git add .cursor-plugin/marketplace.json
            git commit --no-edit
            trap - EXIT
            rm -f "$BASE" "$OURS" "$THEIRS"
          fi
          UPSTREAM_SHA=$(git rev-parse --short FETCH_HEAD)
          node scripts/generate-pi-harness.mjs
          node scripts/generate-codex-harness.mjs
          node scripts/generate-devin-harness.mjs
          node scripts/generate-agy-harness.mjs
          git add -- harness/pi/pstack harness/codex/pstack harness/devin/pstack harness/agy/pstack
          if ! git diff --cached --quiet -- harness/pi/pstack harness/codex/pstack harness/devin/pstack harness/agy/pstack; then
            git commit -m "chore(harness): regenerate Pi, Codex, Devin, and AGY for upstream $UPSTREAM_SHA"
          fi
          node scripts/generate-codex-harness.mjs --check
          node --test scripts/generate-codex-harness.test.mjs
          node scripts/generate-pi-harness.mjs --check
          node scripts/generate-pstack-harness-trees.mjs --check
          node --test scripts/generate-pi-harness.test.mjs
          node scripts/generate-devin-harness.mjs --check
          node --test scripts/generate-devin-harness.test.mjs
          node scripts/generate-agy-harness.mjs --check
          node --test scripts/generate-agy-harness.test.mjs
          node --test scripts/merge-marketplace.test.mjs
          npm install --no-save ajv ajv-formats
          node scripts/validate-plugins.mjs
          npm ci --prefix scripts/pi-sdk --ignore-scripts
          PI_HARNESS_SDK="$GITHUB_WORKSPACE/scripts/pi-sdk/node_modules/@earendil-works/pi-coding-agent/dist/index.js" node --test scripts/pi-harness-sdk.test.mjs
          git push origin main
      - name: Report sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TITLE="Upstream sync failed"
          BODY="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          If the upstream merge touches .github/workflows, the default GITHUB_TOKEN cannot push it. Add a SYNC_TOKEN secret (a fine-grained PAT with contents and workflows write on this repo), or run \"Sync fork\" in the GitHub UI and push by hand."
          EXISTING=$(gh issue list --repo "$GH_REPO" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" --body "$BODY"
          else
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body "$BODY"
          fi
