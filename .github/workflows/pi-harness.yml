name: pi-harness

on:
  pull_request:
    paths:
      - "pstack/**"
      - "cursor-team-kit/**"
      - "harness/**"
      - "scripts/generate-pi-harness*"
      - "scripts/pi-harness-sdk.test.mjs"
      - "scripts/pi-sdk/**"
      - "package.json"
      - ".github/workflows/pi-harness.yml"
      - ".github/workflows/sync-upstream.yml"
  push:
    branches: [main]
    paths:
      - "pstack/**"
      - "cursor-team-kit/**"
      - "harness/**"
      - "scripts/generate-pi-harness*"
      - "scripts/pi-harness-sdk.test.mjs"
      - "scripts/pi-sdk/**"
      - "package.json"
      - ".github/workflows/pi-harness.yml"
      - ".github/workflows/sync-upstream.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-pi-harness.mjs --check
      - run: node scripts/generate-pstack-harness-trees.mjs --check
      - run: node --test scripts/generate-pi-harness.test.mjs
      - run: |
          npm ci --prefix scripts/pi-sdk --ignore-scripts
          PI_HARNESS_SDK="$GITHUB_WORKSPACE/scripts/pi-sdk/node_modules/@earendil-works/pi-coding-agent/dist/index.js" node --test scripts/pi-harness-sdk.test.mjs
